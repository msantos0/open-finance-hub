name: open-finance-hub

services:

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  open-finance-hub:
    build: .
    container_name: open-finance-hub
    depends_on:
      - mongodb
    ports:
      - "8085:8085"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/open_finance_hub
      JWT_SECRET: open-finance-hub-development-secret-key-please-change
      JWT_EXPIRATION_MS: 86400000

volumes:
  mongodb_data: