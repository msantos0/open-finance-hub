name: open-finance-hub

services:

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  open-finance-hub:
    build: .
    container_name: open-finance-hub
    depends_on:
      - mongodb
    ports:
      - "8085:8085"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/open_finance_hub

volumes:
  mongodb_data: